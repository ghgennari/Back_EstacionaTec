# Configuracao compartilhada da camera IP. A senha fica fora do Git.
spring.config.import=optional:file:./storage/camera-local.properties
estacionatec.camera.source=${CAMERA_SOURCE:IP}
# CAMERA_PASSWORD deve usar codificacao de URL (por exemplo, @ vira %40).
estacionatec.camera.password=${CAMERA_PASSWORD:}
estacionatec.camera.rtsp-url=${CAMERA_RTSP_URL:rtsp://admin:${estacionatec.camera.password}@192.168.1.188:554/onvif1}
estacionatec.camera.ffmpeg=${FFMPEG_PATH:ffmpeg}
estacionatec.camera.rtsp-transport=${CAMERA_RTSP_TRANSPORT:udp}
