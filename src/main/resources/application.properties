spring.application.name=estacionatec-api

# Banco em memoria para desenvolvimento local
spring.datasource.url=jdbc:h2:mem:estacionatec;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false
server.address=127.0.0.1

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
estacionatec.seed.enabled=true
estacionatec.storage=storage/imagens
estacionatec.camera.snapshot-url=${CAMERA_SNAPSHOT_URL:}
estacionatec.esp32.open-url=${ESP32_OPEN_URL:}
