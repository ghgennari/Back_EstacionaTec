# Perfil PostgreSQL para desenvolvimento local.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/estacionatec
spring.datasource.username=estacionatec
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Preserva os registros entre reinicios; uso local, sem migracoes de producao.
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
