server.address=0.0.0.0
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.config.import=

spring.datasource.url=jdbc:h2:file:/data/banco/estacionatec;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=${DB_USERNAME:estacionatec}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
estacionatec.seed.enabled=false
estacionatec.storage=/data/imagens
estacionatec.cors.origins=${CORS_ALLOWED_ORIGINS:}
estacionatec.camera.source=${CAMERA_SOURCE:IP}
estacionatec.camera.ffmpeg=ffmpeg

estacionatec.admin.name=${ADMIN_NAME:Administrador}
estacionatec.admin.username=${ADMIN_USERNAME:admin}
estacionatec.admin.email=${ADMIN_EMAIL:}
estacionatec.admin.password=${ADMIN_PASSWORD:}
