# Banco para desenvolvimento local; API executada pelo VS Code/Maven.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: estacionatec
      POSTGRES_USER: estacionatec
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no terminal}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estacionatec -d estacionatec"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
